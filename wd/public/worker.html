<!doctype html>
<meta charset="utf-8">
<title>Remote benchmark worker</title>
<style>body{font:14px/1.5 system-ui,sans-serif;max-width:760px;margin:1.5rem auto;padding:0 1rem}pre{background:#8881;border:1px solid #8884;border-radius:6px;padding:.6rem;max-height:60vh;overflow:auto}</style>
<h2>Remote benchmark worker</h2>
<p id="state">starting…</p>
<pre id="log"></pre>
<script type="module">
  import { runWorker } from "./js/worker_client.js";
  const log = (m) => { const el = document.getElementById("log"); el.textContent += m + "\n"; el.scrollTop = el.scrollHeight; };
  const state = document.getElementById("state");
  state.textContent = "initialising back-ends… (keep this tab open)";
  runWorker({ log: (m) => { log(m); if (m.startsWith("job")) state.textContent = m; } })
    .then((n) => { state.textContent = `finished: ${n} job(s) done. You can close this tab.`; })
    .catch((e) => { state.textContent = "error: " + e; log(String(e.stack ?? e)); });
</script>
